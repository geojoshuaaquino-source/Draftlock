name: Integrate mockup with real functionality
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expose existing functional screens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/draftlock/app/MainActivity.kt')
          s=p.read_text()
          for name in ['HomeScreen','WriteScreen','UnifiedAppsScreen','DocsScreen','SettingsScreen']:
              s=s.replace(f'private fun {name}(', f'fun {name}(')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/draftlock/app/MainActivity.kt
          git commit -m 'Expose functional screens for glass UI'
          git push
      - name: Remove workflow
        run: |
          git rm .github/workflows/integrate-mockup-functionality.yml
          git commit -m 'Remove temporary UI integration workflow'
          git push
