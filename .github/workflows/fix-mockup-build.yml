name: Fix Mockup Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mockup source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/draftlock/app/MockupActivity.kt')
          s = p.read_text()
          s = s.replace('R.drawable.ic_search', 'R.drawable.ic_docs')
          s = s.replace('R.drawable.ic_github', 'R.drawable.ic_google')
          s = re.sub(
              r'\s*val req = vm\.isRequirement\(app\.packageName\);\s*val locked = vm\.isLocked\(app\.packageName\)\s*\n\s*if \(req == null\)',
              '\n            if (req == null)',
              s,
          )
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/draftlock/app/MockupActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix remaining mockup compile errors"
            git push
          fi
          # Keep this workflow source-only; the normal Android workflow produces the APK.
