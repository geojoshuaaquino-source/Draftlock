name: Fix Mockup Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix mockup source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/draftlock/app/MockupActivity.kt')
          s = p.read_text()
          s = s.replace('R.drawable.ic_search', 'R.drawable.ic_docs')
          s = s.replace('R.drawable.ic_github', 'R.drawable.ic_lock_closed')
          old = '''        if (req != null) Slider(value = minutes, onValueChange = { minutes = it }, valueRange = 5f..480f, steps = 94, onValueChangeFinished = { vm.updateRequirementMinutes(req.id, minutes.toInt()) })'''
          new = '''        vm.isRequirement(app.packageName)?.let { currentReq ->
            Slider(value = minutes, onValueChange = { minutes = it }, valueRange = 5f..480f, steps = 94, onValueChangeFinished = { vm.updateRequirementMinutes(currentReq.id, minutes.toInt()) })
        }'''
          s = s.replace(old, new)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/draftlock/app/MockupActivity.kt
          git diff --cached --quiet || git commit -m "Fix mockup UI compile blockers"
          git push || true
