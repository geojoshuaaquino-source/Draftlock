name: Fix Mockup Build
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix mockup source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/draftlock/app/MockupActivity.kt')
          s = p.read_text()
          s = s.replace('R.drawable.ic_search', 'R.drawable.ic_docs')
          s = s.replace('R.drawable.ic_github', 'R.drawable.ic_google')
          s = re.sub(
              r'\s*val req = vm\.isRequirement\(app\.packageName\);\s*val locked = vm\.isLocked\(app\.packageName\)\s*\n\s*if \(req == null\)',
              '\n            if (req == null)',
              s,
          )
          p.write_text(s)
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/draftlock/app/MockupActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m "Fix remaining mockup compile errors"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DraftLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
